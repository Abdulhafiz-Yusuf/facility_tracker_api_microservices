server:
  port: 8082

spring:
  application:
    name: PAYMENT-SERVICE

  # Database — payment service has its OWN database
  # datasource:
  #   url: jdbc:mysql://localhost:3306/payment_db
  #   username: hafiz
  #   password: yourpassword
  # jpa:
  #   hibernate:
  #     ddl-auto: update
  #   show-sql: true

  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  h2:
    console:
      enabled: true

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true

  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

# Eureka — register with the registry
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/